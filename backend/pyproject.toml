[project]
name = "lorvo"
version = "0.1.0"
description = "AI assistant that answers questions about your team's documents, with citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "markdown-it-py>=4.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorvo"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # prefer pathlib
    "N",             # naming
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lorvo", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; harmless.
    "ignore:builtin type (SwigPy|swigvarlink).*:DeprecationWarning",
]
markers = [
    "integration: needs a running Postgres+pgvector (set TEST_DATABASE_URL)",
]
