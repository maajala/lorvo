name: lorvo

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lorvo
      POSTGRES_PASSWORD: lorvo
      POSTGRES_DB: lorvo
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the lorvo_test database used by integration tests.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorvo"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
