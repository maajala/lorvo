name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lorvo
          POSTGRES_PASSWORD: lorvo
          POSTGRES_DB: lorvo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lorvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests use the fake embedder; the torch-based local embedder is an
      # optional extra and is never installed in CI.
      EMBEDDER: fake
      TEST_DATABASE_URL: postgresql+psycopg://lorvo:lorvo@localhost:5432/lorvo_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest
